# Deployed with `npx wrangler deploy` (see README.md). KV namespace id and the rate limiter are set
# per account; logs stay off: the Worker must not record anything about who sends a cook.
name = "api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = false

[[kv_namespaces]]
binding = "COOKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
