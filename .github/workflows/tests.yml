name: Tests
on:
  push:
    paths-ignore: ["data/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Worker
        run: cd worker && node --test test/*.test.js
      - name: Nightly build
        run: pip install pytest && python3 -m pytest -q build
