# Weekly and on demand only (STANDARD.md 1.5). Switch off GitHub's CodeQL "default setup" (Settings -> Code security).
name: CodeQL
on:
  schedule:
    - cron: "47 5 * * 0"        # Sunday 05:47 UTC: two hours after this project's weekly CI slot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: Legal-Copy7045/project-standards/.github/workflows/codeql.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with:
      languages: '["actions", "python", "javascript-typescript"]'
